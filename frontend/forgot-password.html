<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password – ZYNTRA</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 30px 16px;">

  <!-- Return to Landing Page Arrow -->
  <div style="max-width: 440px; width: 100%; margin-bottom: 14px; display: flex; justify-content: flex-start;">
    <a href="/" style="display: inline-flex; align-items: center; gap: 8px; font-size: 0.88rem; font-weight: 500; color: var(--text-secondary); text-decoration: none; padding: 7px 14px; border-radius: var(--radius-sm); background: var(--bg-surface); border: 1px solid var(--border-subtle); transition: all 0.2s ease;">
      <i data-lucide="arrow-left" style="width: 16px; height: 16px;"></i>
      <span>Back to Landing Page</span>
    </a>
  </div>

  <div class="form-card" style="max-width: 440px; width: 100%;">
    <div style="text-align: center; margin-bottom: 28px;">
      <a href="/" style="display: inline-flex; align-items: center; gap: 10px; margin-bottom: 12px;">
        <div class="logo-icon" style="width: 40px; height: 40px; font-size: 1.35rem;">Z</div>
        <span class="logo-text" style="font-size: 1.6rem;">ZYNTRA</span>
      </a>
      <h2 style="font-size: 1.4rem; font-weight: 700; margin-bottom: 6px;" id="reset-header">Reset Your Password</h2>
      <p style="font-size: 0.88rem; color: var(--text-secondary);" id="reset-subtext">Enter your verified email to receive instructions.</p>
    </div>

    <!-- Step 1: Request Reset Link -->
    <form id="request-reset-form" onsubmit="handleRequestReset(event)">
      <div class="form-group">
        <label class="form-label" for="email">Account Email</label>
        <input type="email" id="email" class="form-input" placeholder="you@domain.com" required autocomplete="email">
      </div>

      <button type="submit" id="request-btn" class="btn btn-primary" style="width: 100%; padding: 13px; margin-top: 8px;">
        <i data-lucide="mail"></i>
        <span>Send Reset Link</span>
      </button>
    </form>

    <!-- Step 2: Set New Password (shown when recovery token active) -->
    <form id="update-password-form" style="display: none;" onsubmit="handleUpdatePassword(event)">
      <div class="form-group">
        <label class="form-label" for="new_password">New Password</label>
        <input type="password" id="new_password" class="form-input" placeholder="Minimum 6 characters" required minlength="6" autocomplete="new-password">
      </div>

      <div class="form-group">
        <label class="form-label" for="confirm_password">Confirm New Password</label>
        <input type="password" id="confirm_password" class="form-input" placeholder="Repeat new password" required minlength="6" autocomplete="new-password">
      </div>

      <button type="submit" id="update-btn" class="btn btn-primary" style="width: 100%; padding: 13px; margin-top: 8px;">
        <i data-lucide="check"></i>
        <span>Update Password</span>
      </button>
    </form>

    <div style="text-align: center; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border-subtle); font-size: 0.9rem; color: var(--text-secondary);">
      Remembered your password? <a href="/login" style="color: var(--primary); font-weight: 600;">Back to Login</a>
    </div>
  </div>

  <script src="/js/supabaseClient.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      window.UI.renderIcons();

      // Check if user arrived via recovery link
      const hash = window.location.hash;
      if (hash && (hash.includes('type=recovery') || hash.includes('access_token='))) {
        document.getElementById('request-reset-form').style.display = 'none';
        document.getElementById('update-password-form').style.display = 'block';
        document.getElementById('reset-header').textContent = 'Set New Password';
        document.getElementById('reset-subtext').textContent = 'Create a secure new password for your ZYNTRA account.';
        window.UI.renderIcons();
      }
    });

    async function handleRequestReset(event) {
      event.preventDefault();
      const btn = document.getElementById('request-btn');
      const email = document.getElementById('email').value.trim();

      if (!email) return;

      try {
        btn.disabled = true;
        btn.innerHTML = `<span>Sending email...</span>`;

        await window.Auth.resetPassword(email);

        window.UI.showToast('Password reset link sent to your email!', 'success', 6000);
        btn.innerHTML = `<i data-lucide="check"></i><span>Link Sent</span>`;
        window.UI.renderIcons();
      } catch (err) {
        window.UI.showToast(err.message || 'Failed to send reset email', 'error');
        btn.disabled = false;
        btn.innerHTML = `<i data-lucide="mail"></i><span>Send Reset Link</span>`;
        window.UI.renderIcons();
      }
    }

    async function handleUpdatePassword(event) {
      event.preventDefault();
      const btn = document.getElementById('update-btn');
      const newPass = document.getElementById('new_password').value;
      const confirmPass = document.getElementById('confirm_password').value;

      if (newPass !== confirmPass) {
        window.UI.showToast('Passwords do not match.', 'error');
        return;
      }

      try {
        btn.disabled = true;
        btn.innerHTML = `<span>Updating password...</span>`;

        await window.Auth.updatePassword(newPass);

        window.UI.showToast('Password updated successfully! Please log in.', 'success');
        setTimeout(() => {
          window.location.href = '/login';
        }, 1200);
      } catch (err) {
        window.UI.showToast(err.message || 'Failed to update password', 'error');
        btn.disabled = false;
        btn.innerHTML = `<i data-lucide="check"></i><span>Update Password</span>`;
        window.UI.renderIcons();
      }
    }
  </script>
</body>
</html>
