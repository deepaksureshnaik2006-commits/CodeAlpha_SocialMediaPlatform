<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile – ZYNTRA</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div id="navigation-shell"></div>

  <main class="app-main">
    <div class="profile-container">

      <!-- Profile Header Card -->
      <div class="profile-header" id="user-header">
        <div class="profile-avatar-wrapper">
          <img id="user-avatar" src="" alt="Avatar" class="profile-avatar-large">
        </div>

        <div class="profile-info">
          <div class="profile-title-row">
            <h1 class="profile-username" id="user-username">loading...</h1>
            <span id="private-badge" style="display: none; background: rgba(99, 102, 241, 0.15); color: #818cf8; font-size: 0.76rem; font-weight: 600; padding: 4px 10px; border-radius: var(--radius-full); align-items: center; gap: 4px;">
              <i data-lucide="lock" style="width: 12px; height: 12px;"></i> Private
            </span>
            <div class="profile-actions" id="user-actions">
              <!-- Dynamically populated with Follow / Following button or Edit Profile -->
            </div>
          </div>

          <!-- Stats Counters -->
          <div class="profile-stats">
            <div class="stat-item">
              <span class="stat-count" id="stat-posts">0</span> posts
            </div>
            <a href="#" id="followers-link" class="stat-item">
              <span class="stat-count" id="stat-followers">0</span> followers
            </a>
            <a href="#" id="following-link" class="stat-item">
              <span class="stat-count" id="stat-following">0</span> following
            </a>
          </div>

          <!-- Bio Section (No public email) -->
          <div class="profile-bio">
            <strong id="user-fullname">...</strong>
            <p id="user-bio-text" style="white-space: pre-line; color: var(--text-secondary); margin-top: 4px;"></p>
          </div>
        </div>
      </div>

      <!-- Navigation Tabs: POSTS & REELS -->
      <div class="profile-tabs" id="user-profile-tabs">
        <button class="profile-tab active" id="tab-posts" onclick="switchUserMediaTab('posts')">
          <i data-lucide="grid" style="width: 16px; height: 16px;"></i>
          <span>POSTS</span>
        </button>
        <button class="profile-tab" id="tab-reels" onclick="switchUserMediaTab('reels')">
          <i data-lucide="clapperboard" style="width: 16px; height: 16px;"></i>
          <span>REELS</span>
        </button>
      </div>

      <!-- Posts & Reels Grid -->
      <div class="post-grid" id="user-posts-grid">
        <div style="grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 40px;">
          Loading posts...
        </div>
      </div>

      <!-- Locked Private Account Container (Shown when private & not followed) -->
      <div id="private-lock-view" style="display: none; text-align: center; padding: 60px 24px; background: var(--bg-card); border-radius: var(--radius-lg); border: 1px solid var(--border-subtle); margin-top: 10px;">
        <div style="width: 64px; height: 64px; border-radius: 50%; background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px;">
          <i data-lucide="lock" style="width: 32px; height: 32px;"></i>
        </div>
        <h3 style="font-size: 1.35rem; font-weight: 700; margin-bottom: 8px;">This Account is Private</h3>
        <p style="color: var(--text-secondary); max-width: 360px; margin: 0 auto 20px; font-size: 0.92rem;">
          Follow this account to see their photos and reels.
        </p>
      </div>

    </div>
  </main>

  <script src="/js/supabaseClient.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/components.js"></script>
  <script>
    let targetUser = null;
    let targetUsername = '';
    let userMediaItems = [];
    let activeUserTab = 'posts';

    document.addEventListener('DOMContentLoaded', async () => {
      await window.Auth.requireAuth();
      await window.Components.renderNavigation('explore');

      const pathParts = window.location.pathname.split('/');
      targetUsername = pathParts[pathParts.length - 1];

      if (!targetUsername || targetUsername === 'user' || targetUsername === 'user.html') {
        const params = new URLSearchParams(window.location.search);
        targetUsername = params.get('username') || params.get('u');
      }

      if (!targetUsername) {
        document.querySelector('.profile-container').innerHTML = `
          <div style="padding: 40px; text-align: center;">
            <h3>User not found</h3>
            <a href="/explore" class="btn btn-primary" style="margin-top: 14px;">Explore Creators</a>
          </div>
        `;
        return;
      }

      loadUserProfile(targetUsername);
    });

    async function loadUserProfile(username) {
      try {
        const res = await window.API.get(`/api/users/${username}`);
        if (!res.success || !res.user) {
          document.querySelector('.profile-container').innerHTML = `
            <div style="padding: 40px; text-align: center;">
              <h3>User @${username} not found</h3>
              <a href="/explore" class="btn btn-primary" style="margin-top: 14px;">Explore Creators</a>
            </div>
          `;
          return;
        }

        targetUser = res.user;

        document.getElementById('user-avatar').src = window.UI.getAvatarUrl(targetUser);
        document.getElementById('user-username').textContent = targetUser.username;
        document.getElementById('user-fullname').textContent = targetUser.full_name || targetUser.username;
        document.getElementById('user-bio-text').textContent = targetUser.bio || '';

        // Privacy indicator
        if (targetUser.is_private) {
          const badge = document.getElementById('private-badge');
          if (badge) badge.style.display = 'inline-flex';
        }

        document.getElementById('stat-posts').textContent = targetUser.posts_count || 0;
        document.getElementById('stat-followers').textContent = targetUser.followers_count || 0;
        document.getElementById('stat-following').textContent = targetUser.following_count || 0;

        document.getElementById('followers-link').href = `/user/${targetUser.username}/followers`;
        document.getElementById('following-link').href = `/user/${targetUser.username}/following`;

        // Action button
        const actionsContainer = document.getElementById('user-actions');
        if (targetUser.is_me) {
          actionsContainer.innerHTML = `
            <a href="/edit-profile" class="btn btn-secondary btn-sm">
              <i data-lucide="edit-3" style="width: 14px; height: 14px;"></i>
              <span>Edit Profile</span>
            </a>
          `;
        } else {
          let btnText = 'Follow';
          let btnClass = 'btn-primary';
          let btnIcon = 'user-plus';

          if (targetUser.is_following) {
            btnText = 'Following';
            btnClass = 'btn-secondary';
            btnIcon = 'check';
          } else if (targetUser.is_requested) {
            btnText = 'Requested';
            btnClass = 'btn-secondary';
            btnIcon = 'clock';
          }

          actionsContainer.innerHTML = `
            <button class="btn ${btnClass} btn-sm" id="profile-follow-btn" onclick="toggleProfileFollow()" style="display: inline-flex; align-items: center; gap: 6px;">
              <i data-lucide="${btnIcon}" style="width: 14px; height: 14px;"></i>
              <span id="follow-btn-label">${btnText}</span>
            </button>
          `;
        }

        // Load Posts
        loadUserPosts(targetUser.username);
        window.UI.renderIcons();
      } catch (err) {
        console.error('Error loading user profile:', err);
      }
    }

    async function toggleProfileFollow() {
      if (!targetUser) return;
      const btn = document.getElementById('profile-follow-btn');
      const followersElem = document.getElementById('stat-followers');
      const isFollowing = targetUser.is_following;
      const isRequested = targetUser.is_requested;

      try {
        btn.disabled = true;

        if (isFollowing) {
          if (!confirm(`Unfollow @${targetUser.username}?`)) {
            btn.disabled = false;
            return;
          }

          const res = await window.API.delete(`/api/users/${targetUser.id}/follow`);
          if (res.success) {
            targetUser.is_following = false;
            targetUser.is_requested = false;
            btn.className = 'btn btn-primary btn-sm';
            btn.innerHTML = `<i data-lucide="user-plus" style="width: 14px; height: 14px;"></i><span id="follow-btn-label">Follow</span>`;
            if (followersElem) followersElem.textContent = res.followers_count;
            window.UI.showToast(res.message || 'Unfollowed', 'info');
            loadUserPosts(targetUser.username);
            window.UI.renderIcons();
          }
        } else if (isRequested) {
          // Cancel follow request
          const res = await window.API.delete(`/api/users/${targetUser.id}/follow`);
          if (res.success) {
            targetUser.is_requested = false;
            targetUser.is_following = false;
            btn.className = 'btn btn-primary btn-sm';
            btn.innerHTML = `<i data-lucide="user-plus" style="width: 14px; height: 14px;"></i><span id="follow-btn-label">Follow</span>`;
            window.UI.showToast(res.message || 'Follow request cancelled', 'info');
            window.UI.renderIcons();
          }
        } else {
          // Follow or send follow request
          const res = await window.API.post(`/api/users/${targetUser.id}/follow`);
          if (res.success) {
            if (res.is_requested) {
              // Private account: follow request sent
              targetUser.is_requested = true;
              targetUser.is_following = false;
              btn.className = 'btn btn-secondary btn-sm';
              btn.innerHTML = `<i data-lucide="clock" style="width: 14px; height: 14px;"></i><span id="follow-btn-label">Requested</span>`;
              window.UI.showToast(res.message || 'Follow request sent!', 'info');
            } else {
              // Public account: directly following
              targetUser.is_following = true;
              targetUser.is_requested = false;
              btn.className = 'btn btn-secondary btn-sm';
              btn.innerHTML = `<i data-lucide="check" style="width: 14px; height: 14px;"></i><span id="follow-btn-label">Following</span>`;
              if (followersElem) followersElem.textContent = res.followers_count;
              window.UI.showToast(res.message || 'Now following!', 'success');
              loadUserPosts(targetUser.username);
            }
            window.UI.renderIcons();
          }
        }
      } catch (err) {
        window.UI.showToast(err.message || 'Failed to update follow status', 'error');
      } finally {
        btn.disabled = false;
      }
    }

    async function loadUserPosts(username) {
      const grid = document.getElementById('user-posts-grid');
      const lockView = document.getElementById('private-lock-view');
      const tabs = document.getElementById('user-profile-tabs');

      try {
        const res = await window.API.get(`/api/users/${username}/posts`);
        if (res.is_private) {
          grid.style.display = 'none';
          tabs.style.display = 'none';
          lockView.style.display = 'block';
          window.UI.renderIcons();
          return;
        }

        grid.style.display = 'grid';
        tabs.style.display = 'flex';
        lockView.style.display = 'none';

        if (res.success && res.posts) {
          userMediaItems = res.posts;
          renderUserGridByTab(activeUserTab);
        }
      } catch (err) {
        grid.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; color: var(--danger); padding: 40px;">Failed to load posts.</div>`;
      }
    }

    function switchUserMediaTab(tab) {
      activeUserTab = tab;
      document.getElementById('tab-posts').classList.toggle('active', tab === 'posts');
      document.getElementById('tab-reels').classList.toggle('active', tab === 'reels');
      renderUserGridByTab(tab);
    }

    function renderUserGridByTab(tab) {
      const grid = document.getElementById('user-posts-grid');
      let filtered = [];

      if (tab === 'posts') {
        filtered = userMediaItems.filter(p => !window.Components.isVideoUrl(p.image_url));
      } else if (tab === 'reels') {
        filtered = userMediaItems.filter(p => window.Components.isVideoUrl(p.image_url));
      }

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; padding: 48px 20px; color: var(--text-muted);">
            <i data-lucide="${tab === 'reels' ? 'clapperboard' : 'camera'}" style="width: 36px; height: 36px; margin-bottom: 12px;"></i>
            <h3 style="font-size: 1.15rem; font-weight: 700; margin-bottom: 6px;">No ${tab === 'reels' ? 'Reels' : 'Posts'} Yet</h3>
            <p style="font-size: 0.88rem;">@${targetUsername} hasn't published any ${tab === 'reels' ? 'reels' : 'posts'} so far.</p>
          </div>
        `;
        window.UI.renderIcons();
        return;
      }

      grid.innerHTML = filtered.map(p => {
        const isVideo = window.Components.isVideoUrl(p.image_url);
        const mediaTag = isVideo ? `
          <video src="${p.image_url}" style="width: 100%; height: 100%; object-fit: cover;" muted></video>
          <div style="position: absolute; top: 10px; right: 10px; color: #fff; background: rgba(0,0,0,0.6); border-radius: 50%; padding: 4px; display: flex;">
            <i data-lucide="play" style="width: 14px; height: 14px; fill: #fff;"></i>
          </div>
        ` : `
          <img src="${p.image_url}" alt="Post thumbnail" loading="lazy">
        `;

        const deleteBtn = (targetUser && targetUser.is_me) ? `
          <button type="button" class="post-grid-delete-btn" onclick="deleteUserMedia(event, '${p.id}')" title="Delete ${isVideo ? 'Reel' : 'Post'}" style="position: absolute; top: 8px; right: 8px; z-index: 5; background: rgba(239, 68, 68, 0.85); color: #fff; border: none; border-radius: 6px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; backdrop-filter: blur(4px); transition: transform 0.2s, background 0.2s;" onmouseover="this.style.background='#dc2626'; this.style.transform='scale(1.1)'" onmouseout="this.style.background='rgba(239, 68, 68, 0.85)'; this.style.transform='scale(1)'">
            <i data-lucide="trash-2" style="width: 15px; height: 15px;"></i>
          </button>
        ` : '';

        return `
          <div class="grid-item-card" style="position: relative; overflow: hidden; border-radius: var(--radius-md);">
            ${deleteBtn}
            <a href="/post/${p.id}" class="grid-item">
              ${mediaTag}
              <div class="grid-overlay">
                <div class="grid-overlay-stat">
                  <i data-lucide="heart" style="fill: #fff; width: 18px; height: 18px;"></i>
                  <span>${p.likes_count}</span>
                </div>
                <div class="grid-overlay-stat">
                  <i data-lucide="message-circle" style="fill: #fff; width: 18px; height: 18px;"></i>
                  <span>${p.comments_count}</span>
                </div>
              </div>
            </a>
          </div>
        `;
      }).join('');

      window.UI.renderIcons();
    }

    async function deleteUserMedia(event, postId) {
      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }

      if (!confirm('Are you sure you want to delete this permanently? This cannot be undone.')) return;

      try {
        const res = await window.API.delete(`/api/posts/${postId}`);
        if (res.success) {
          window.UI.showToast('Item deleted successfully', 'success');
          userMediaItems = userMediaItems.filter(p => p.id !== postId);
          renderUserGridByTab(activeUserTab);

          const countEl = document.getElementById('stat-posts');
          if (countEl) countEl.textContent = userMediaItems.length;
        } else {
          window.UI.showToast(res.message || 'Failed to delete item', 'error');
        }
      } catch (err) {
        window.UI.showToast(err.message || 'Failed to delete item', 'error');
      }
    }
  </script>
</body>
</html>
