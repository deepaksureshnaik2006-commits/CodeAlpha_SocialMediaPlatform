<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post Details – ZYNTRA</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div id="navigation-shell"></div>

  <main class="app-main">
    <div style="width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 16px;">

      <!-- Top Back Link -->
      <div>
        <a href="javascript:history.back()" class="btn btn-outline btn-sm" style="display: inline-flex;">
          <i data-lucide="arrow-left" style="width: 14px; height: 14px;"></i> Back
        </a>
      </div>

      <!-- Main Post Card Container (Split View) -->
      <div id="post-container" style="background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); overflow: hidden; display: flex; flex-wrap: wrap; box-shadow: var(--shadow-md);">
        <div style="width: 100%; text-align: center; color: var(--text-muted); padding: 60px;">
          Loading post details...
        </div>
      </div>

    </div>
  </main>

  <script src="/js/supabaseClient.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/components.js"></script>
  <script>
    let currentPost = null;
    let currentUser = null;
    let editingCommentId = null;

    document.addEventListener('DOMContentLoaded', async () => {
      currentUser = await window.Auth.requireAuth();
      await window.Components.renderNavigation('feed');

      // Extract Post ID from URL pathname (/post/:id) or query (?id=...)
      const pathParts = window.location.pathname.split('/');
      let postId = pathParts[pathParts.length - 1];
      if (!postId || postId === 'post' || postId === 'post.html') {
        const params = new URLSearchParams(window.location.search);
        postId = params.get('id');
      }

      if (!postId) {
        document.getElementById('post-container').innerHTML = `
          <div style="padding: 40px; text-align: center; width: 100%;">
            <h3>Invalid Post URL</h3>
            <a href="/feed" class="btn btn-primary" style="margin-top: 14px;">Go to Feed</a>
          </div>
        `;
        return;
      }

      loadPost(postId);
    });

    async function loadPost(postId) {
      const container = document.getElementById('post-container');
      try {
        const res = await window.API.get(`/api/posts/${postId}`);
        if (!res.success || !res.post) {
          container.innerHTML = `<div style="padding: 40px; text-align: center; width: 100%;">Post not found.</div>`;
          return;
        }

        currentPost = res.post;
        renderPostDetails(currentPost);
      } catch (err) {
        container.innerHTML = `<div style="padding: 40px; text-align: center; width: 100%; color: var(--danger);">Failed to load post: ${err.message}</div>`;
      }
    }

    function renderPostDetails(post) {
      const container = document.getElementById('post-container');
      const author = post.author || {};
      const authorAvatar = window.UI.getAvatarUrl(author);
      const isLikedClass = post.is_liked ? 'liked' : '';
      const likesCountText = post.likes_count === 1 ? '1 like' : `${post.likes_count} likes`;

      container.innerHTML = `
        <!-- Left: Image Viewer with double tap -->
        <div style="flex: 1 1 450px; background: #000; display: flex; align-items: center; justify-content: center; position: relative; min-height: 420px; max-height: 600px; cursor: pointer;" ondblclick="Components.handlePostDoubleTap('${post.id}')">
          <img src="${post.image_url}" alt="Post image" style="max-height: 100%; max-width: 100%; object-fit: contain;">
          <div class="heart-burst" id="detail-heart-burst">
            <i data-lucide="heart" style="width: 80px; height: 80px;"></i>
          </div>
        </div>

        <!-- Right: Author, Caption, Scrollable Comments, Interaction Form -->
        <div style="flex: 1 1 360px; display: flex; flex-direction: column; border-left: 1px solid var(--border-subtle); max-height: 600px;">

          <!-- Author Header -->
          <div style="padding: 16px; border-bottom: 1px solid var(--border-subtle); display: flex; align-items: center; justify-content: space-between;">
            <a href="/user/${author.username}" style="display: flex; align-items: center; gap: 12px;">
              <img src="${authorAvatar}" alt="${author.username}" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(99, 102, 241, 0.4);">
              <div>
                <div style="font-weight: 700; font-size: 0.94rem; color: var(--text-primary);">${author.username}</div>
                <div style="font-size: 0.76rem; color: var(--text-muted);">${window.UI.formatTimeAgo(post.created_at)}</div>
              </div>
            </a>
            ${post.is_owner ? `
              <div style="display: flex; gap: 6px;">
                <button class="btn btn-secondary btn-sm" onclick="Components.openEditPostModal('${post.id}', '${encodeURIComponent(post.caption || '')}')" title="Edit Caption">
                  <i data-lucide="edit-3" style="width: 14px; height: 14px;"></i>
                </button>
                <button class="btn btn-danger btn-sm" onclick="deleteThisPost('${post.id}')" title="Delete Post">
                  <i data-lucide="trash-2" style="width: 14px; height: 14px;"></i>
                </button>
              </div>
            ` : ''}
          </div>

          <!-- Comments & Caption Scroll Area -->
          <div style="flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px;" id="comments-list">
            <!-- Author's Caption as first item -->
            ${post.caption ? `
              <div style="display: flex; gap: 12px;">
                <img src="${authorAvatar}" style="width: 32px; height: 32px; border-radius: 50%; object-fit: cover; flex-shrink: 0;">
                <div>
                  <div style="font-size: 0.88rem; line-height: 1.45;">
                    <a href="/user/${author.username}" style="font-weight: 700; color: var(--text-primary); margin-right: 6px;">${author.username}</a>
                    <span id="detail-caption-text">${Components.escapeHtml(post.caption)}</span>
                  </div>
                  <div style="font-size: 0.74rem; color: var(--text-muted); margin-top: 4px;">${window.UI.formatTimeAgo(post.created_at)}</div>
                </div>
              </div>
            ` : ''}

            <!-- Comments Stream -->
            ${(post.comments || []).map(c => renderCommentRow(c)).join('')}
          </div>

          <!-- Footer Actions & Quick Comment -->
          <div style="border-top: 1px solid var(--border-subtle); padding: 12px 16px; background: var(--bg-surface);">
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;">
              <div style="display: flex; align-items: center; gap: 12px;">
                <button class="action-btn ${isLikedClass}" id="like-btn-${post.id}" onclick="handleDetailLike('${post.id}')">
                  <i data-lucide="heart"></i>
                </button>
                <button class="action-btn" onclick="document.getElementById('post-comment-input').focus()">
                  <i data-lucide="message-circle"></i>
                </button>
                <button class="action-btn" onclick="Components.copyPostLink('${post.id}')">
                  <i data-lucide="send"></i>
                </button>
              </div>
            </div>

            <div class="post-likes-count" id="likes-count-${post.id}" onclick="Components.openLikesModal('${post.id}')" style="margin-bottom: 8px;">
              ${likesCountText}
            </div>

            <form onsubmit="submitComment(event, '${post.id}')" style="display: flex; align-items: center; gap: 8px;">
              <input type="text" id="post-comment-input" class="comment-input" placeholder="Add a comment..." autocomplete="off">
              <button type="submit" class="comment-submit-btn">Post</button>
            </form>
          </div>

        </div>
      `;

      window.UI.renderIcons();
    }

    function renderCommentRow(c) {
      const author = c.author || {};
      const authorAvatar = window.UI.getAvatarUrl(author);
      const isOwner = c.is_owner;

      return `
        <div style="display: flex; justify-content: space-between; gap: 10px;" id="comment-item-${c.id}">
          <div style="display: flex; gap: 12px; flex: 1;">
            <a href="/user/${author.username}">
              <img src="${authorAvatar}" style="width: 32px; height: 32px; border-radius: 50%; object-fit: cover; flex-shrink: 0;">
            </a>
            <div style="flex: 1;">
              <div style="font-size: 0.88rem; line-height: 1.45;" id="comment-body-${c.id}">
                <a href="/user/${author.username}" style="font-weight: 700; color: var(--text-primary); margin-right: 6px;">${author.username}</a>
                <span class="comment-content">${Components.escapeHtml(c.comment_text)}</span>
              </div>
              <div style="display: flex; align-items: center; gap: 12px; margin-top: 4px; font-size: 0.74rem; color: var(--text-muted);">
                <span>${window.UI.formatTimeAgo(c.created_at)}</span>
                ${isOwner ? `
                  <button style="color: var(--text-muted); font-size: 0.74rem;" onclick="promptEditComment('${c.id}')">Edit</button>
                  <button style="color: var(--danger); font-size: 0.74rem;" onclick="deleteComment('${c.id}')">Delete</button>
                ` : ''}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    async function handleDetailLike(postId) {
      await window.Components.toggleLike(postId);
    }

    async function submitComment(event, postId) {
      event.preventDefault();
      const input = document.getElementById('post-comment-input');
      const text = input.value.trim();
      if (!text) return;

      try {
        input.disabled = true;
        const res = await window.API.post(`/api/posts/${postId}/comments`, { comment_text: text });
        if (res.success && res.comment) {
          input.value = '';
          const commentsList = document.getElementById('comments-list');
          commentsList.insertAdjacentHTML('beforeend', renderCommentRow(res.comment));
          commentsList.scrollTop = commentsList.scrollHeight;
          window.UI.renderIcons();
          window.UI.showToast('Comment added!', 'success');
        }
      } catch (err) {
        window.UI.showToast(err.message || 'Failed to post comment', 'error');
      } finally {
        input.disabled = false;
        input.focus();
      }
    }

    async function promptEditComment(commentId) {
      const commentItem = document.getElementById(`comment-item-${commentId}`);
      if (!commentItem) return;
      const textElem = commentItem.querySelector('.comment-content');
      const oldText = textElem ? textElem.textContent : '';

      const newText = prompt('Edit your comment:', oldText);
      if (newText === null || newText.trim() === '' || newText === oldText) return;

      try {
        const res = await window.API.put(`/api/comments/${commentId}`, { comment_text: newText.trim() });
        if (res.success) {
          textElem.textContent = newText.trim();
          window.UI.showToast('Comment updated', 'success');
        }
      } catch (err) {
        window.UI.showToast(err.message || 'Failed to edit comment', 'error');
      }
    }

    async function deleteComment(commentId) {
      if (!confirm('Delete this comment?')) return;
      try {
        const res = await window.API.delete(`/api/comments/${commentId}`);
        if (res.success) {
          const item = document.getElementById(`comment-item-${commentId}`);
          if (item) item.remove();
          window.UI.showToast('Comment deleted', 'success');
        }
      } catch (err) {
        window.UI.showToast(err.message || 'Failed to delete comment', 'error');
      }
    }

    async function deleteThisPost(postId) {
      if (!confirm('Are you sure you want to delete this post permanently?')) return;
      try {
        const res = await window.API.delete(`/api/posts/${postId}`);
        if (res.success) {
          window.UI.showToast('Post deleted', 'success');
          setTimeout(() => {
            window.location.href = '/feed';
          }, 600);
        }
      } catch (err) {
        window.UI.showToast(err.message || 'Failed to delete post', 'error');
      }
    }
  </script>
</body>
</html>
