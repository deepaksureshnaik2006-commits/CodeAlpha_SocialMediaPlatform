<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Feed – ZYNTRA</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- Navigation Shell (Desktop sidebar & Mobile navigation injected here) -->
  <div id="navigation-shell"></div>

  <!-- App Main Content Area -->
  <main class="app-main">
    <div class="feed-layout">

      <!-- Center Feed Column -->
      <section class="feed-column">

        <!-- Top Stories / Suggested Creators Bar -->
        <div class="stories-bar" id="stories-bar">
          <div style="display: flex; align-items: center; justify-content: center; width: 100%; color: var(--text-muted); font-size: 0.85rem; padding: 6px;">
            Loading community creators...
          </div>
        </div>

        <!-- Feed Discovery Banner (Shown if user follows nobody) -->
        <div id="discovery-banner" style="display: none; background: rgba(99, 102, 241, 0.1); border: 1px solid rgba(99, 102, 241, 0.3); border-radius: var(--radius-md); padding: 14px 18px; align-items: center; justify-content: space-between; gap: 12px;">
          <div style="display: flex; align-items: center; gap: 10px;">
            <i data-lucide="compass" style="color: var(--primary);"></i>
            <span style="font-size: 0.88rem; color: var(--text-primary);">Showing trending community posts to get you started!</span>
          </div>
          <a href="/explore" class="btn btn-primary btn-sm">Find Friends</a>
        </div>

        <!-- Posts Stream Container -->
        <div id="feed-posts" style="display: flex; flex-direction: column; gap: 24px;">
          <!-- Skeleton Loading Placeholders -->
          <div class="post-card" style="padding: 20px; text-align: center; color: var(--text-muted);">
            <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 16px;">
              <div style="width: 40px; height: 40px; border-radius: 50%; background: #182338;"></div>
              <div style="width: 120px; height: 16px; background: #182338; border-radius: 4px;"></div>
            </div>
            <div style="width: 100%; aspect-ratio: 1/1; background: #182338; border-radius: 8px;"></div>
          </div>
        </div>

        <!-- Load More Button -->
        <div style="text-align: center; padding: 20px 0;">
          <button id="load-more-btn" class="btn btn-secondary" onclick="loadMorePosts()" style="display: none; margin: 0 auto;">
            <i data-lucide="refresh-cw"></i>
            <span>Load More Posts</span>
          </button>
          <div id="feed-end-notice" style="display: none; color: var(--text-muted); font-size: 0.88rem; padding: 10px;">
            ✨ You're all caught up!
          </div>
        </div>

      </section>

      <!-- Right Aside (Suggestions & User Info) -->
      <aside class="feed-aside">

        <!-- Current User Profile Card -->
        <div class="aside-card" id="user-profile-summary">
          <div style="display: flex; align-items: center; gap: 12px;">
            <div style="width: 46px; height: 46px; border-radius: 50%; background: #182338;" id="aside-user-avatar-placeholder"></div>
            <div style="flex: 1; min-width: 0;">
              <div style="font-weight: 700; font-size: 0.95rem;" id="aside-user-fullname">Loading...</div>
              <div style="font-size: 0.8rem; color: var(--text-muted);" id="aside-user-handle">@...</div>
            </div>
            <a href="/profile" class="btn btn-outline btn-sm">View</a>
          </div>
        </div>

        <!-- Suggested Users to Follow -->
        <div class="aside-card">
          <div class="aside-title">
            <h3>Suggested for You</h3>
            <a href="/explore">See All</a>
          </div>
          <div class="user-suggestion-list" id="suggestions-list">
            <div style="color: var(--text-muted); font-size: 0.84rem; text-align: center; padding: 10px;">Finding creators...</div>
          </div>
        </div>

        <!-- Footer Links -->
        <div style="font-size: 0.74rem; color: var(--text-muted); line-height: 1.6; padding: 0 4px;">
          About • Help • API • Privacy • Terms • Locations • Language<br>
          &copy; 2026 ZYNTRA SOCIAL MEDIA PLATFORM
        </div>

      </aside>

    </div>
  </main>

  <script src="/js/supabaseClient.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/components.js"></script>
  <script>
    let currentPage = 1;
    let hasMorePosts = false;
    let isLoading = false;
    let currentUser = null;

    document.addEventListener('DOMContentLoaded', async () => {
      // 1. Guard authenticated page
      currentUser = await window.Auth.requireAuth();
      if (!currentUser) return;

      // 2. Render Navigation Shell
      await window.Components.renderNavigation('feed');

      // 3. Render Aside User Card
      populateAsideUser(currentUser);

      // 4. Fetch Feed Posts
      await fetchFeedPosts(1);

      // 5. Fetch Suggestions & Stories
      fetchSuggestedUsers();
    });

    function populateAsideUser(user) {
      const avatarContainer = document.getElementById('aside-user-avatar-placeholder');
      if (avatarContainer) {
        avatarContainer.outerHTML = `<img src="${window.UI.getAvatarUrl(user)}" style="width: 48px; height: 48px; border-radius: 50%; object-fit: cover;">`;
      }
      document.getElementById('aside-user-fullname').textContent = user.full_name || user.username;
      document.getElementById('aside-user-handle').textContent = `@${user.username}`;
    }

    async function fetchFeedPosts(page = 1) {
      if (isLoading) return;
      isLoading = true;

      const container = document.getElementById('feed-posts');
      const loadMoreBtn = document.getElementById('load-more-btn');
      const endNotice = document.getElementById('feed-end-notice');
      const discoveryBanner = document.getElementById('discovery-banner');

      try {
        const res = await window.API.get(`/api/posts/feed?page=${page}&limit=6`);

        if (page === 1) {
          container.innerHTML = '';
        }

        if (res.isDiscovery) {
          discoveryBanner.style.display = 'flex';
        }

        if (!res.posts || res.posts.length === 0) {
          if (page === 1) {
            container.innerHTML = `
              <div class="post-card" style="text-align: center; padding: 48px 24px;">
                <div class="feature-icon-wrapper" style="margin: 0 auto 16px;">
                  <i data-lucide="camera" style="width: 28px; height: 28px;"></i>
                </div>
                <h3 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 8px;">No Posts Yet</h3>
                <p style="color: var(--text-secondary); max-width: 360px; margin: 0 auto 20px; font-size: 0.9rem;">
                  Your feed shows posts from creators you follow and your own photos. Be the first to share!
                </p>
                <div style="display: flex; justify-content: center; gap: 12px;">
                  <a href="/create-post" class="btn btn-primary"><i data-lucide="plus"></i> Create Post</a>
                  <a href="/explore" class="btn btn-secondary"><i data-lucide="compass"></i> Explore</a>
                </div>
              </div>
            `;
          }
          loadMoreBtn.style.display = 'none';
          endNotice.style.display = page > 1 ? 'block' : 'none';
          window.UI.renderIcons();
          return;
        }

        // Render each post card
        res.posts.forEach(post => {
          container.insertAdjacentHTML('beforeend', window.Components.renderPostCard(post));
        });

        currentPage = page;
        hasMorePosts = res.hasMore;

        loadMoreBtn.style.display = res.hasMore ? 'inline-flex' : 'none';
        endNotice.style.display = !res.hasMore && page > 1 ? 'block' : 'none';

        window.UI.renderIcons();
      } catch (err) {
        console.error('Failed to load feed:', err);
        window.UI.showToast('Failed to load feed posts', 'error');
      } finally {
        isLoading = false;
      }
    }

    async function loadMorePosts() {
      const btn = document.getElementById('load-more-btn');
      btn.disabled = true;
      btn.innerHTML = `<i data-lucide="loader"></i><span>Loading...</span>`;
      window.UI.renderIcons();

      await fetchFeedPosts(currentPage + 1);

      btn.disabled = false;
      btn.innerHTML = `<i data-lucide="refresh-cw"></i><span>Load More Posts</span>`;
      window.UI.renderIcons();
    }

    async function fetchSuggestedUsers() {
      const storiesBar = document.getElementById('stories-bar');
      const suggestionsList = document.getElementById('suggestions-list');

      try {
        const res = await window.API.get('/api/users/explore?limit=8');
        if (res.success && res.users.length > 0) {
          // Render Stories Bar
          storiesBar.innerHTML = res.users.slice(0, 7).map(u => `
            <a href="/user/${u.username}" class="story-item">
              <div class="story-ring">
                <img src="${window.UI.getAvatarUrl(u)}" alt="${u.username}" class="story-avatar">
              </div>
              <span class="story-username truncate">${u.username}</span>
            </a>
          `).join('');

          // Render Suggestions List
          suggestionsList.innerHTML = res.users.slice(0, 5).map(u => `
            <div class="suggestion-item">
              <a href="/user/${u.username}" class="suggestion-user">
                <img src="${window.UI.getAvatarUrl(u)}" alt="${u.username}" class="suggestion-avatar">
                <div class="suggestion-details">
                  <div class="suggestion-name truncate">${u.full_name || u.username}</div>
                  <div class="suggestion-sub truncate">@${u.username}</div>
                </div>
              </a>
              <button class="btn ${u.is_following ? 'btn-secondary' : 'btn-primary'} btn-sm" id="aside-follow-btn-${u.id}" onclick="Components.toggleFollow('${u.id}', 'aside-follow-btn-${u.id}')">
                ${u.is_following ? 'Following' : 'Follow'}
              </button>
            </div>
          `).join('');

          window.UI.renderIcons();
        } else {
          storiesBar.style.display = 'none';
          suggestionsList.innerHTML = `<div style="color: var(--text-muted); font-size: 0.84rem;">No suggestions available right now.</div>`;
        }
      } catch (err) {
        console.error('Error fetching suggestions:', err);
      }
    }
  </script>
</body>
</html>
