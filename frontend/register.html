<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account – ZYNTRA</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 30px 16px;">

  <!-- Return to Home Arrow -->
  <div style="max-width: 460px; width: 100%; margin-bottom: 14px; display: flex; justify-content: flex-start;">
    <a href="/" style="display: inline-flex; align-items: center; gap: 8px; font-size: 0.88rem; font-weight: 500; color: var(--text-secondary); text-decoration: none; padding: 7px 14px; border-radius: var(--radius-sm); background: var(--bg-surface); border: 1px solid var(--border-subtle); transition: all 0.2s ease;">
      <i data-lucide="arrow-left" style="width: 16px; height: 16px;"></i>
      <span>Back to Home</span>
    </a>
  </div>

  <div class="form-card" style="max-width: 460px; width: 100%;">
    <div style="text-align: center; margin-bottom: 28px;">
      <a href="/" style="display: inline-flex; align-items: center; gap: 10px; margin-bottom: 12px;">
        <div class="logo-icon" style="width: 40px; height: 40px; font-size: 1.35rem;">Z</div>
        <span class="logo-text" style="font-size: 1.6rem;">ZYNTRA</span>
      </a>
      <h2 style="font-size: 1.4rem; font-weight: 700; margin-bottom: 6px;">Join Our Community</h2>
      <p style="font-size: 0.88rem; color: var(--text-secondary);">Sign up to see photos and stories from your friends.</p>
    </div>

    <form id="register-form" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label class="form-label" for="full_name">Full Name</label>
        <input type="text" id="full_name" class="form-input" placeholder="e.g. Maya Lin" required autocomplete="name">
      </div>

      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <label class="form-label" for="username">Username</label>
          <span id="username-feedback" style="font-size: 0.78rem;"></span>
        </div>
        <input type="text" id="username" class="form-input" placeholder="e.g. mayalin" required autocomplete="username" oninput="validateUsernameLive(this.value)">
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" id="email" class="form-input" placeholder="you@domain.com" required autocomplete="email">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div style="position: relative; display: flex; align-items: center;">
          <input type="password" id="password" class="form-input" placeholder="Minimum 6 characters" required minlength="6" autocomplete="new-password" style="padding-right: 44px; width: 100%;">
          <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('password', this)" style="position: absolute; right: 12px; background: none; border: none; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 4px;" aria-label="Toggle password visibility">
            <i data-lucide="eye" style="width: 18px; height: 18px;"></i>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="bio">Bio <span style="font-size: 0.76rem; color: var(--text-muted);">(optional)</span></label>
        <textarea id="bio" class="form-textarea" placeholder="Tell the community a little about yourself..." style="min-height: 70px;"></textarea>
      </div>

      <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%; padding: 13px; margin-top: 6px;">
        <i data-lucide="user-plus"></i>
        <span>Create Account</span>
      </button>
    </form>

    <div style="text-align: center; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border-subtle); font-size: 0.9rem; color: var(--text-secondary);">
      Already have an account? <a href="/login" style="color: var(--primary); font-weight: 600;">Log In</a>
    </div>
  </div>

  <script src="/js/supabaseClient.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    let checkTimeout = null;
    let isUsernameAvailable = false;
    let lastCheckedUsername = '';

    document.addEventListener('DOMContentLoaded', async () => {
      window.UI.renderIcons();
      // Redirect if user already logged in
      await window.Auth.redirectIfAuthenticated();
    });

    // Live username debounce check
    function validateUsernameLive(val) {
      clearTimeout(checkTimeout);
      const feedback = document.getElementById('username-feedback');
      const usernameInput = document.getElementById('username');
      const submitBtn = document.getElementById('submit-btn');
      const clean = val.trim().toLowerCase();

      if (!clean) {
        feedback.textContent = '';
        usernameInput.style.borderColor = 'var(--border-subtle)';
        isUsernameAvailable = false;
        return;
      }

      if (clean.length < 3) {
        feedback.innerHTML = '<span style="color: var(--danger); font-weight: 500;">Min 3 characters</span>';
        usernameInput.style.borderColor = 'var(--danger)';
        isUsernameAvailable = false;
        return;
      }

      if (!/^[a-zA-Z0-9._]+$/.test(clean)) {
        feedback.innerHTML = '<span style="color: var(--danger); font-weight: 500;">Letters, numbers, _, . only</span>';
        usernameInput.style.borderColor = 'var(--danger)';
        isUsernameAvailable = false;
        return;
      }

      feedback.innerHTML = '<span style="color: var(--text-muted);">Checking availability...</span>';
      usernameInput.style.borderColor = 'var(--border-subtle)';

      checkTimeout = setTimeout(async () => {
        try {
          const res = await fetch(`/api/auth/check-username?username=${encodeURIComponent(clean)}`);
          const data = await res.json();
          lastCheckedUsername = clean;

          if (data.available) {
            feedback.innerHTML = '<span style="color: #10b981; font-weight: 600;">✓ Available</span>';
            usernameInput.style.borderColor = '#10b981';
            isUsernameAvailable = true;
            submitBtn.disabled = false;
          } else {
            feedback.innerHTML = '<span style="color: #ef4444; font-weight: 600;">✗ Taken – choose a different one</span>';
            usernameInput.style.borderColor = '#ef4444';
            isUsernameAvailable = false;
            submitBtn.disabled = true;
          }
        } catch (e) {
          feedback.textContent = '';
        }
      }, 350);
    }

    async function handleRegister(event) {
      event.preventDefault();
      const submitBtn = document.getElementById('submit-btn');
      const fullName = document.getElementById('full_name').value.trim();
      const username = document.getElementById('username').value.trim().toLowerCase();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const bio = document.getElementById('bio').value.trim();

      if (!fullName || !username || !email || !password) {
        window.UI.showToast('Please fill out all required fields.', 'error');
        return;
      }

      if (username.length < 3) {
        window.UI.showToast('Username must be at least 3 characters long.', 'error');
        document.getElementById('username').focus();
        return;
      }

      // Check if username is already taken before submitting
      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span>Checking username...</span>`;

      try {
        const checkRes = await fetch(`/api/auth/check-username?username=${encodeURIComponent(username)}`);
        const checkData = await checkRes.json();

        if (!checkData.available) {
          window.UI.showToast(`The username "@${username}" is already taken. Please choose a different one.`, 'error');
          const usernameInput = document.getElementById('username');
          const feedback = document.getElementById('username-feedback');
          usernameInput.style.borderColor = '#ef4444';
          feedback.innerHTML = '<span style="color: #ef4444; font-weight: 600;">✗ Taken – choose a different one</span>';
          usernameInput.focus();
          submitBtn.disabled = true;
          submitBtn.innerHTML = `<i data-lucide="user-plus"></i><span>Create Account</span>`;
          window.UI.renderIcons();
          return;
        }
      } catch (checkErr) {
        console.warn('Pre-check error:', checkErr);
      }

      try {
        submitBtn.disabled = true;
        submitBtn.innerHTML = `<span>Creating account...</span>`;

        const result = await window.Auth.signUp({
          email,
          password,
          username,
          full_name: fullName,
          bio
        });

        window.UI.showToast(`Account created! Welcome to ZYNTRA, @${username}!`, 'success');

        setTimeout(() => {
          window.location.href = '/feed';
        }, 600);
      } catch (err) {
        console.error('Registration failed:', err);
        window.UI.showToast(err.message || 'Registration failed. Please try again.', 'error');
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<i data-lucide="user-plus"></i><span>Create Account</span>`;
        window.UI.renderIcons();
      }
    }

    // Toggle password visibility with eye icon
    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (!input) return;
      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';
      btn.innerHTML = `<i data-lucide="${isPassword ? 'eye-off' : 'eye'}" style="width: 18px; height: 18px;"></i>`;
      window.UI.renderIcons();
    }
  </script>
</body>
</html>
