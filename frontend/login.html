<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In – ZYNTRA</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 30px 16px;">

  <!-- Return to Home Arrow -->
  <div style="max-width: 420px; width: 100%; margin-bottom: 14px; display: flex; justify-content: flex-start;">
    <a href="/" style="display: inline-flex; align-items: center; gap: 8px; font-size: 0.88rem; font-weight: 500; color: var(--text-secondary); text-decoration: none; padding: 7px 14px; border-radius: var(--radius-sm); background: var(--bg-surface); border: 1px solid var(--border-subtle); transition: all 0.2s ease;">
      <i data-lucide="arrow-left" style="width: 16px; height: 16px;"></i>
      <span>Back to Home</span>
    </a>
  </div>

  <div class="form-card" style="max-width: 420px; width: 100%;">
    <div style="text-align: center; margin-bottom: 28px;">
      <a href="/" style="display: inline-flex; align-items: center; gap: 10px; margin-bottom: 12px;">
        <div class="logo-icon" style="width: 40px; height: 40px; font-size: 1.35rem;">Z</div>
        <span class="logo-text" style="font-size: 1.6rem;">ZYNTRA</span>
      </a>
      <h2 style="font-size: 1.4rem; font-weight: 700; margin-bottom: 6px;">Welcome Back</h2>
      <p style="font-size: 0.88rem; color: var(--text-secondary);">Connect with your world and discover stories.</p>
    </div>

    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" id="email" class="form-input" placeholder="you@domain.com" required autocomplete="email">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div style="position: relative; display: flex; align-items: center;">
          <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password" style="padding-right: 44px; width: 100%;">
          <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('password', this)" style="position: absolute; right: 12px; background: none; border: none; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 4px;" aria-label="Toggle password visibility">
            <i data-lucide="eye" style="width: 18px; height: 18px;"></i>
          </button>
        </div>
      </div>

      <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%; padding: 13px; margin-top: 8px;">
        <i data-lucide="log-in"></i>
        <span>Sign In</span>
      </button>
    </form>

    <div style="text-align: center; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border-subtle); font-size: 0.9rem; color: var(--text-secondary);">
      Don't have an account? <a href="/register" style="color: var(--primary); font-weight: 600;">Sign Up</a>
    </div>
  </div>

  <script src="/js/supabaseClient.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      window.UI.renderIcons();

      // Check URL parameters for banners
      const params = new URLSearchParams(window.location.search);
      if (params.get('msg') === 'session_expired') {
        window.UI.showToast('Your session expired. Please sign in again.', 'info');
      }

      // If already logged in, redirect to feed
      await window.Auth.redirectIfAuthenticated();
    });

    // Toggle password visibility with eye icon
    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (!input) return;
      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';
      btn.innerHTML = `<i data-lucide="${isPassword ? 'eye-off' : 'eye'}" style="width: 18px; height: 18px;"></i>`;
      window.UI.renderIcons();
    }

    async function handleLogin(event) {
      event.preventDefault();
      const submitBtn = document.getElementById('submit-btn');
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) return;

      try {
        submitBtn.disabled = true;
        submitBtn.innerHTML = `<span>Signing in...</span>`;

        await window.Auth.signIn(email, password);

        window.UI.showToast('Welcome back!', 'success');

        const params = new URLSearchParams(window.location.search);
        const redirect = params.get('redirect') || '/feed';

        setTimeout(() => {
          window.location.href = redirect;
        }, 600);
      } catch (err) {
        console.error('Login error:', err);
        window.UI.showToast(err.message || 'Invalid email or password', 'error');
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<i data-lucide="log-in"></i><span>Sign In</span>`;
        window.UI.renderIcons();
      }
    }
  </script>
</body>
</html>
