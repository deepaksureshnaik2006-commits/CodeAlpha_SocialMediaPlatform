<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore – ZYNTRA</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div id="navigation-shell"></div>

  <main class="app-main">
    <div style="width: 100%; max-width: 920px; display: flex; flex-direction: column; gap: 24px;">

      <!-- Search Header -->
      <div style="background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 20px 24px;">
        <div style="position: relative;">
          <i data-lucide="search" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); width: 18px; height: 18px;"></i>
          <input type="text" id="search-input" class="form-input" placeholder="Search creators by username or name..." style="width: 100%; padding-left: 42px;" oninput="handleSearch(this.value)">
        </div>
      </div>

      <!-- Tab Switcher -->
      <div class="profile-tabs" style="border: none; justify-content: flex-start; gap: 14px;">
        <button class="profile-tab active" id="tab-posts" onclick="switchTab('posts')">
          <i data-lucide="grid"></i>
          <span>Trending Posts</span>
        </button>
        <button class="profile-tab" id="tab-reels" onclick="switchTab('reels')">
          <i data-lucide="clapperboard"></i>
          <span>Reels</span>
        </button>
        <button class="profile-tab" id="tab-users" onclick="switchTab('users')">
          <i data-lucide="users"></i>
          <span>Creators to Follow</span>
        </button>
      </div>

      <!-- Tab 1: Posts & Reels Grid -->
      <div id="posts-view">
        <div class="post-grid" id="explore-posts-grid">
          <div style="grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 40px;">
            Loading trending posts...
          </div>
        </div>
      </div>

      <!-- Tab 2: Users List Grid -->
      <div id="users-view" style="display: none;">
        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px;" id="explore-users-grid">
          <div style="grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 40px;">
            Finding creators...
          </div>
        </div>
      </div>

    </div>
  </main>

  <script src="/js/supabaseClient.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/components.js"></script>
  <script>
    let currentTab = 'posts';
    let allExplorePosts = [];
    let searchDebounce = null;

    document.addEventListener('DOMContentLoaded', async () => {
      await window.Auth.requireAuth();

      const params = new URLSearchParams(window.location.search);
      const requestedTab = params.get('tab') || 'posts';

      await window.Components.renderNavigation(requestedTab === 'reels' ? 'reels' : 'explore');
      await loadExplorePosts();
      loadExploreUsers();

      if (requestedTab === 'reels') {
        switchTab('reels');
      }
    });

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tab-posts').classList.toggle('active', tab === 'posts');
      document.getElementById('tab-reels').classList.toggle('active', tab === 'reels');
      document.getElementById('tab-users').classList.toggle('active', tab === 'users');

      const postsView = document.getElementById('posts-view');
      const usersView = document.getElementById('users-view');

      if (tab === 'users') {
        postsView.style.display = 'none';
        usersView.style.display = 'block';
      } else {
        postsView.style.display = 'block';
        usersView.style.display = 'none';
        renderFilteredPosts(tab === 'reels');
      }

      window.UI.renderIcons();
    }

    function renderFilteredPosts(onlyReels = false) {
      const grid = document.getElementById('explore-posts-grid');
      let filtered = allExplorePosts;

      if (onlyReels) {
        filtered = allExplorePosts.filter(p => window.UI.isVideoUrl(p.image_url));
      }

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 60px 20px;">
            <i data-lucide="${onlyReels ? 'clapperboard' : 'image'}" style="width: 44px; height: 44px; margin: 0 auto 12px; display: block; opacity: 0.5;"></i>
            <h4 style="font-size: 1.1rem; color: var(--text-primary); margin-bottom: 6px;">${onlyReels ? 'No Video Reels Yet' : 'No Posts Found'}</h4>
            <p style="font-size: 0.88rem;">${onlyReels ? 'Upload an MP4 or WebM video up to 50MB to share the first Reel!' : 'Be the first to share a post on ZYNTRA!'}</p>
            <a href="/create-post" class="btn btn-primary" style="margin: 16px auto 0; display: inline-flex;">
              <i data-lucide="plus-square"></i>
              <span>Create Post or Reel</span>
            </a>
          </div>
        `;
        window.UI.renderIcons();
        return;
      }

      grid.innerHTML = filtered.map(post => {
        const isVideo = window.UI.isVideoUrl(post.image_url);
        const mediaHtml = isVideo
          ? `<video src="${post.image_url}#t=0.001" preload="metadata" muted playsinline style="width: 100%; height: 100%; object-fit: cover;"></video>
             <div style="position: absolute; top: 8px; right: 8px; z-index: 2; background: rgba(0,0,0,0.65); padding: 4px 6px; border-radius: 6px; display: flex; align-items: center; gap: 4px; font-size: 0.72rem; color: #fff; font-weight: 600;">
               <i data-lucide="clapperboard" style="width: 12px; height: 12px;"></i>
               <span>REEL</span>
             </div>`
          : `<img src="${post.image_url}" alt="Post image" loading="lazy">`;

        return `
          <a href="/post/${post.id}" class="grid-item" style="position: relative;">
            ${mediaHtml}
            <div class="grid-overlay">
              <div class="grid-overlay-stat">
                <i data-lucide="heart" style="fill: #fff; width: 18px; height: 18px;"></i>
                <span>${post.likes_count}</span>
              </div>
              <div class="grid-overlay-stat">
                <i data-lucide="message-circle" style="fill: #fff; width: 18px; height: 18px;"></i>
                <span>${post.comments_count}</span>
              </div>
            </div>
          </a>
        `;
      }).join('');

      window.UI.renderIcons();
    }

    async function loadExplorePosts() {
      const grid = document.getElementById('explore-posts-grid');
      try {
        const res = await window.API.get('/api/posts/explore?limit=40');
        if (res.success && res.posts) {
          allExplorePosts = res.posts;
          renderFilteredPosts(currentTab === 'reels');
        } else {
          allExplorePosts = [];
          renderFilteredPosts(currentTab === 'reels');
        }
      } catch (err) {
        grid.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; color: var(--danger); padding: 40px;">Failed to load posts.</div>`;
      }
    }

    async function loadExploreUsers(searchQuery = '') {
      const grid = document.getElementById('explore-users-grid');
      try {
        const endpoint = searchQuery ? `/api/users/explore?q=${encodeURIComponent(searchQuery)}` : '/api/users/explore?limit=30';
        const res = await window.API.get(endpoint);

        if (res.success && res.users.length > 0) {
          grid.innerHTML = res.users.map(u => `
            <div style="background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 20px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; overflow: hidden; min-width: 0;">
              <a href="/user/${u.username}">
                <img src="${window.UI.getAvatarUrl(u)}" alt="${u.username}" style="width: 72px; height: 72px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(99, 102, 241, 0.4);">
              </a>
              <div style="width: 100%; min-width: 0;">
                <a href="/user/${u.username}" style="font-weight: 700; font-size: 1rem; color: var(--text-primary); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${u.full_name || u.username}</a>
                <div style="font-size: 0.8rem; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">@${u.username}</div>
              </div>
              <div style="font-size: 0.82rem; color: var(--text-secondary); line-height: 1.45; width: 100%; min-width: 0; min-height: 38px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word;">
                ${u.bio ? window.Components.escapeHtml(u.bio) : 'ZYNTRA community creator'}
              </div>
              <div style="font-size: 0.8rem; color: var(--text-muted);">
                <strong style="color: var(--text-primary);">${u.followers_count}</strong> followers
              </div>
              <button class="btn ${u.is_following || u.is_requested ? 'btn-secondary' : 'btn-primary'} btn-sm" style="width: 100%; margin-top: 4px;" id="explore-follow-btn-${u.id}" onclick="Components.toggleFollow('${u.id}', 'explore-follow-btn-${u.id}')">
                ${u.is_following ? 'Following' : (u.is_requested ? 'Requested' : 'Follow')}
              </button>
            </div>
          `).join('');
          window.UI.renderIcons();
        } else {
          grid.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 40px;">No creators found matching "${searchQuery}".</div>`;
        }
      } catch (err) {
        grid.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; color: var(--danger); padding: 40px;">Failed to load creators.</div>`;
      }
    }

    function handleSearch(val) {
      clearTimeout(searchDebounce);
      searchDebounce = setTimeout(() => {
        // Automatically switch to users view if searching
        if (val.trim() && currentTab !== 'users') {
          switchTab('users');
        }
        loadExploreUsers(val.trim());
      }, 350);
    }
  </script>
</body>
</html>
