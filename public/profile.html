<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile – ZYNTRA</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div id="navigation-shell"></div>

  <main class="app-main">
    <div class="profile-container">

      <!-- Profile Header Card -->
      <div class="profile-header">
        <div class="profile-avatar-wrapper">
          <img id="profile-avatar" src="" alt="Avatar" class="profile-avatar-large">
        </div>

        <div class="profile-info">
          <div class="profile-title-row">
            <h1 class="profile-username" id="profile-username">loading...</h1>
            <div class="profile-actions">
              <a href="/edit-profile" class="btn btn-secondary btn-sm">
                <i data-lucide="edit-3" style="width: 14px; height: 14px;"></i>
                <span>Edit Profile</span>
              </a>
              <a href="/settings" class="btn btn-outline btn-icon" title="Settings">
                <i data-lucide="settings" style="width: 16px; height: 16px;"></i>
              </a>
            </div>
          </div>

          <!-- Stats Counters -->
          <div class="profile-stats">
            <div class="stat-item">
              <span class="stat-count" id="stat-posts">0</span> posts
            </div>
            <a href="#" id="followers-link" class="stat-item">
              <span class="stat-count" id="stat-followers">0</span> followers
            </a>
            <a href="#" id="following-link" class="stat-item">
              <span class="stat-count" id="stat-following">0</span> following
            </a>
          </div>

          <!-- Bio Section -->
          <div class="profile-bio">
            <strong id="profile-fullname">...</strong>
            <p id="profile-bio-text" style="white-space: pre-line;">...</p>
            <div style="font-size: 0.78rem; color: var(--text-muted); margin-top: 6px;" id="profile-email"></div>
          </div>
        </div>
      </div>

      <!-- Navigation Tabs -->
      <div class="profile-tabs">
        <div class="profile-tab active">
          <i data-lucide="grid" style="width: 16px; height: 16px;"></i>
          <span>POSTS</span>
        </div>
      </div>

      <!-- Posts Grid -->
      <div class="post-grid" id="profile-posts-grid">
        <div style="grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 40px;">
          Loading your posts...
        </div>
      </div>

    </div>
  </main>

  <script src="/js/supabaseClient.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/components.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = await window.Auth.requireAuth();
      if (!user) return;

      await window.Components.renderNavigation('profile');
      loadMyProfile();
    });

    async function loadMyProfile() {
      try {
        const res = await window.API.get('/api/users/me');
        if (!res.success || !res.user) {
          window.UI.showToast('Could not load profile details', 'error');
          return;
        }

        const u = res.user;
        document.getElementById('profile-avatar').src = window.UI.getAvatarUrl(u);
        document.getElementById('profile-username').textContent = u.username;
        document.getElementById('profile-fullname').textContent = u.full_name || u.username;
        document.getElementById('profile-bio-text').textContent = u.bio || 'No bio yet.';
        document.getElementById('profile-email').textContent = `Email: ${u.email || ''}`;

        document.getElementById('stat-posts').textContent = u.posts_count || 0;
        document.getElementById('stat-followers').textContent = u.followers_count || 0;
        document.getElementById('stat-following').textContent = u.following_count || 0;

        document.getElementById('followers-link').href = `/user/${u.username}/followers`;
        document.getElementById('following-link').href = `/user/${u.username}/following`;

        // Load Posts
        loadUserPosts(u.username);
        window.UI.renderIcons();
      } catch (err) {
        console.error('Error loading my profile:', err);
      }
    }

    async function loadUserPosts(username) {
      const grid = document.getElementById('profile-posts-grid');
      try {
        const res = await window.API.get(`/api/users/${username}/posts`);
        if (res.success && res.posts.length > 0) {
          grid.innerHTML = res.posts.map(p => `
            <a href="/post/${p.id}" class="grid-item">
              <img src="${p.image_url}" alt="Post thumbnail" loading="lazy">
              <div class="grid-overlay">
                <div class="grid-overlay-stat">
                  <i data-lucide="heart" style="fill: #fff; width: 18px; height: 18px;"></i>
                  <span>${p.likes_count}</span>
                </div>
                <div class="grid-overlay-stat">
                  <i data-lucide="message-circle" style="fill: #fff; width: 18px; height: 18px;"></i>
                  <span>${p.comments_count}</span>
                </div>
              </div>
            </a>
          `).join('');
          window.UI.renderIcons();
        } else {
          grid.innerHTML = `
            <div style="grid-column: 1 / -1; text-align: center; padding: 48px 20px; background: var(--bg-card); border-radius: var(--radius-lg); border: 1px dashed var(--border-medium);">
              <i data-lucide="camera" style="width: 36px; height: 36px; color: var(--text-muted); margin-bottom: 12px;"></i>
              <h3 style="font-size: 1.15rem; font-weight: 700; margin-bottom: 6px;">Share Your First Post</h3>
              <p style="color: var(--text-secondary); font-size: 0.88rem; margin-bottom: 16px;">Capture moments and share them with the ZYNTRA community.</p>
              <a href="/create-post" class="btn btn-primary btn-sm"><i data-lucide="plus"></i> New Post</a>
            </div>
          `;
          window.UI.renderIcons();
        }
      } catch (err) {
        grid.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; color: var(--danger); padding: 40px;">Failed to load posts.</div>`;
      }
    }
  </script>
</body>
</html>
