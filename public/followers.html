<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Followers – ZYNTRA</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div id="navigation-shell"></div>

  <main class="app-main">
    <div style="width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 20px;">

      <div class="notification-header">
        <div style="display: flex; align-items: center; gap: 12px;">
          <a href="javascript:history.back()" class="action-btn">
            <i data-lucide="arrow-left"></i>
          </a>
          <div>
            <h2 style="font-size: 1.25rem; font-weight: 700;" id="page-title">Followers</h2>
            <div style="font-size: 0.8rem; color: var(--text-muted);" id="user-subtitle">Loading...</div>
          </div>
        </div>
      </div>

      <div id="followers-container" class="notification-list">
        <div style="text-align: center; color: var(--text-muted); padding: 40px;">Loading followers...</div>
      </div>

    </div>
  </main>

  <script src="/js/supabaseClient.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/components.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await window.Auth.requireAuth();
      await window.Components.renderNavigation('profile');

      // Extract username from URL path (/user/:username/followers) or query (?username=...)
      const pathParts = window.location.pathname.split('/');
      let username = '';
      const userIndex = pathParts.indexOf('user');
      if (userIndex !== -1 && pathParts[userIndex + 1]) {
        username = pathParts[userIndex + 1];
      } else {
        const params = new URLSearchParams(window.location.search);
        username = params.get('username') || params.get('user');
      }

      if (!username) {
        const me = await window.Auth.getCurrentUser();
        username = me?.username;
      }

      loadFollowers(username);
    });

    async function loadFollowers(username) {
      const container = document.getElementById('followers-container');
      const subtitle = document.getElementById('user-subtitle');

      try {
        const res = await window.API.get(`/api/users/${username}/followers`);
        if (res.success) {
          subtitle.textContent = `@${username} • ${res.total} followers`;

          if (res.users.length === 0) {
            container.innerHTML = `
              <div style="text-align: center; color: var(--text-muted); padding: 50px 20px; background: var(--bg-card); border-radius: var(--radius-md);">
                <i data-lucide="users" style="width: 36px; height: 36px; margin-bottom: 10px;"></i>
                <div style="font-weight: 600;">No followers yet</div>
                <div style="font-size: 0.84rem; margin-top: 4px;">When people follow @${username}, they'll appear here.</div>
              </div>
            `;
            window.UI.renderIcons();
            return;
          }

          container.innerHTML = res.users.map(u => `
            <div class="notification-item" style="justify-content: space-between;">
              <a href="/user/${u.username}" style="display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1;">
                <img src="${window.UI.getAvatarUrl(u)}" alt="${u.username}" class="notif-avatar">
                <div style="min-width: 0;">
                  <div style="font-weight: 700; font-size: 0.92rem; color: var(--text-primary);">${u.full_name || u.username}</div>
                  <div style="font-size: 0.8rem; color: var(--text-muted);">@${u.username}</div>
                  ${u.bio ? `<div style="font-size: 0.78rem; color: var(--text-secondary); margin-top: 2px;" class="truncate">${u.bio}</div>` : ''}
                </div>
              </a>

              ${!u.is_me ? `
                <button class="btn ${u.is_following ? 'btn-secondary' : 'btn-primary'} btn-sm" id="follower-btn-${u.id}" onclick="Components.toggleFollow('${u.id}', 'follower-btn-${u.id}')">
                  ${u.is_following ? 'Following' : 'Follow'}
                </button>
              ` : ''}
            </div>
          `).join('');

          window.UI.renderIcons();
        }
      } catch (err) {
        container.innerHTML = `<div style="text-align: center; color: var(--danger); padding: 40px;">Failed to load followers: ${err.message}</div>`;
      }
    }
  </script>
</body>
</html>
